<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | Sai Krishna</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fa;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 40px;
        }

        .error-code {
            font-size: 120px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        .home-btn {
            display: inline-block;
            padding: 12px 25px;
            text-decoration: none;
            background: #007bff;
            color: white;
            border-radius: 6px;
            font-size: 16px;
        }

        .home-btn:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="error-code">404</div>

        <h1>Page Not Found</h1>

        <p>
            Sorry, the page you are looking for does not exist.
        </p>

        <a href="index.html" class="home-btn">
            Back to Portfolio
        </a>

    </div>

</body>
</html>
